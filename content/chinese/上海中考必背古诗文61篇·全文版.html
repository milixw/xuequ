<script>
const D = [
["六上","西江月·夜行黄沙道中","辛弃疾 · 宋","词",1,"明月别枝惊鹊，清风半夜鸣蝉。|稻花香里说丰年，听取蛙声一片。|七八个星天外，两三点雨山前。|旧时茅店社林边，路转溪桥忽见。","鹊、蝉、蛙、见(通现)"],
["六上","伯牙鼓琴","《吕氏春秋》","文言文",1,"伯牙鼓琴，锺子期听之。方鼓琴而志在太山，锺子期曰：“善哉乎鼓琴，巍巍乎若太山。”少选之间而志在流水，锺子期又曰：“善哉乎鼓琴，汤汤乎若流水。”锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。","锺、巍、汤汤(shāng)、哉"],
["六上","书戴嵩画牛","苏轼 · 宋","文言文",0,"蜀中有杜处士，好书画，所宝以百数。有戴嵩《牛》一轴，尤所爱，锦囊玉轴，常以自随。|一日曝书画，有一牧童见之，拊掌大笑，曰：“此画斗牛也。牛斗，力在角，尾搐入两股间，今乃掉尾而斗，谬矣。”处士笑而然之。|古语有云：“耕当问奴，织当问婢。”不可改也。","嵩、拊、搐、婢"],
["六上","江南春","杜牧 · 唐","诗",1,"千里莺啼绿映红，水村山郭酒旗风。|南朝四百八十寺，多少楼台烟雨中。","莺、郭、寺"],
["六下","迢迢牵牛星","《古诗十九首》 · 汉","诗",1,"迢迢牵牛星，皎皎河汉女。|纤纤擢素手，札札弄机杼。|终日不成章，泣涕零如雨。|河汉清且浅，相去复几许。|盈盈一水间，脉脉不得语。","迢、皎、擢、札札、杼、脉脉(mò)"],
["六下","学弈","《孟子》","文言文",0,"弈秋，通国之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听；一人虽听之，一心以为有鸿鹄将至，思援弓缴而射之。虽与之俱学，弗若之矣。为是其智弗若与？曰：非然也。","弈、惟、鹄、缴(zhuó)、弗、矣"],
["六下","两小儿辩日","《列子》","文言文",0,"孔子东游，见两小儿辩斗，问其故。|一儿曰：“我以日始出时去人近，而日中时远也。”|一儿曰：“我以日初出远，而日中时近也。”|一儿曰：“日初出大如车盖，及日中则如盘盂，此不为远者小而近者大乎？”|一儿曰：“日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？”|孔子不能决也。|两小儿笑曰：“孰为汝多知乎？”","辩、盂、沧、汤、孰、汝、知(通智)"],
["六下","回乡偶书（一）","贺知章 · 唐","诗",1,"少小离家老大回，乡音无改鬓毛衰。|儿童相见不相识，笑问客从何处来。","鬓、衰(cuī)"],
["六下","竹石","郑燮 · 清","诗",1,"咬定青山不放松，立根原在破岩中。|千磨万击还坚劲，任尔东西南北风。","燮、坚劲(jìng)、尔"],
["七上","观沧海","曹操 · 东汉","诗",1,"东临碣石，以观沧海。|水何澹澹，山岛竦峙。|树木丛生，百草丰茂。|秋风萧瑟，洪波涌起。|日月之行，若出其中；|星汉灿烂，若出其里。|幸甚至哉，歌以咏志。","碣、澹澹、竦峙、萧瑟"],
["七上","十一月四日风雨大作（其二）","陆游 · 宋","诗",1,"僵卧孤村不自哀，尚思为国戍轮台。|夜阑卧听风吹雨，铁马冰河入梦来。","僵、戍(shù)、阑"],
["七上","天净沙·秋思","马致远 · 元","曲",1,"枯藤老树昏鸦，小桥流水人家，古道西风瘦马。|夕阳西下，断肠人在天涯。","藤、瘦、涯(勿写崖)"],
["七上","《论语》十二章","《论语》","文言文",1,"子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”|曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”|子曰：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”|子曰：“温故而知新，可以为师矣。”|子曰：“学而不思则罔，思而不学则殆。”|子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！”|子曰：“知之者不如好之者，好之者不如乐之者。”|子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”|子曰：“三人行，必有我师焉。择其善者而从之，其不善者而改之。”|子在川上曰：“逝者如斯夫，不舍昼夜。”|子曰：“三军可夺帅也，匹夫不可夺志也。”|子夏曰：“博学而笃志，切问而近思，仁在其中矣。”","说(通悦)、愠、省(xǐng)、逾矩、罔、殆、箪(dān)、肱(gōng)、焉、笃"],
["七上","陈太丘与友期行","《世说新语》","文言文",0,"陈太丘与友期行，期日中。过中不至，太丘舍去，去后乃至。元方时年七岁，门外戏。客问元方：“尊君在不？”答曰：“待君久不至，已去。”友人便怒曰：“非人哉！与人期行，相委而去。”元方曰：“君与家君期日中。日中不至，则是无信；对子骂父，则是无礼。”友人惭，下车引之。元方入门不顾。","惭、不(通否)、哉、委"],
["七上","狼","蒲松龄 · 清","文言文",0,"一屠晚归，担中肉尽，止有剩骨。途中两狼，缀行甚远。|屠惧，投以骨。一狼得骨止，一狼仍从。复投之，后狼止而前狼又至。骨已尽矣，而两狼之并驱如故。|屠大窘，恐前后受其敌。顾野有麦场，场主积薪其中，苫蔽成丘。屠乃奔倚其下，弛担持刀。狼不敢前，眈眈相向。|少时，一狼径去，其一犬坐于前。久之，目似瞑，意暇甚。屠暴起，以刀劈狼首，又数刀毙之。方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。身已半入，止露尻尾。屠自后断其股，亦毙之。乃悟前狼假寐，盖以诱敌。|狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。","缀、窘、苫(shàn)、弛、眈眈、瞑、暇、尻(kāo)、寐、黠"],
["七上","穿井得一人","《吕氏春秋》","文言文",0,"宋之丁氏，家无井而出溉汲，常一人居外。及其家穿井，告人曰：“吾穿井得一人。”有闻而传之者，曰：“丁氏穿井得一人。”国人道之，闻之于宋君。宋君令人问之于丁氏。丁氏对曰：“得一人之使，非得一人于井中也。”求闻之若此，不若无闻也。","溉、汲(jí)、若此"],
["七下","登幽州台歌","陈子昂 · 唐","诗",1,"前不见古人，后不见来者。|念天地之悠悠，独怆然而涕下。","怆(chuàng)、涕"],
["七下","泊秦淮","杜牧 · 唐","诗",1,"烟笼寒水月笼沙，夜泊秦淮近酒家。|商女不知亡国恨，隔江犹唱后庭花。","淮、笼、犹"],
["七下","望岳","杜甫 · 唐","诗",1,"岱宗夫如何？齐鲁青未了。|造化钟神秀，阴阳割昏晓。|荡胸生曾云，决眦入归鸟。|会当凌绝顶，一览众山小。","岱、眦(zì)、凌(勿写陵)、览"],
["七下","游山西村","陆游 · 宋","诗",1,"莫笑农家腊酒浑，丰年留客足鸡豚。|山重水复疑无路，柳暗花明又一村。|箫鼓追随春社近，衣冠简朴古风存。|从今若许闲乘月，拄杖无时夜叩门。","浑、豚、箫、拄"],
["七下","陋室铭","刘禹锡 · 唐","文言文",1,"山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？","惟(勿写唯)、馨、鸿儒、案牍(dú)、蜀"],
["七下","爱莲说","周敦颐 · 宋","文言文",1,"水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。|予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。","蕃(fán)、淤、濯(zhuó)、涟、蔓、亵(xiè)、噫、鲜(xiǎn)"],
["七下","孙权劝学","《资治通鉴》","文言文",0,"初，权谓吕蒙曰：“卿今当涂掌事，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经为博士邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。”蒙乃始就学。及鲁肃过寻阳，与蒙论议，大惊曰：“卿今者才略，非复吴下阿蒙！”蒙曰：“士别三日，即更刮目相待，大兄何见事之晚乎！”肃遂拜蒙母，结友而别。","卿、涂、涉猎、邪(通耶)、遂"],
["七下","卖油翁","欧阳修 · 宋","文言文",0,"陈康肃公善射，当世无双，公亦以此自矜。尝射于家圃，有卖油翁释担而立，睨之久而不去。见其发矢十中八九，但微颔之。|康肃问曰：“汝亦知射乎？吾射不亦精乎？”翁曰：“无他，但手熟尔。”康肃忿然曰：“尔安敢轻吾射！”翁曰：“以我酌油知之。”乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。因曰：“我亦无他，惟手熟尔。”康肃笑而遣之。","矜(jīn)、圃、睨(nì)、矢、颔(hàn)、忿然、酌、杓(sháo)、沥、遣"],
["八上","野望","王绩 · 唐","诗",1,"东皋薄暮望，徙倚欲何依。|树树皆秋色，山山唯落晖。|牧人驱犊返，猎马带禽归。|相顾无相识，长歌怀采薇。","皋(gāo)、徙倚(xǐ yǐ)、犊(dú)、薇"],
["八上","答谢中书书","陶弘景 · 南朝","文言文",1,"山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。实是欲界之仙都。自康乐以来，未复有能与其奇者。","颓(tuí)、鳞、竞、与(yù)"],
["八上","浣溪沙（一曲新词酒一杯）","晏殊 · 宋","词",1,"一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？|无可奈何花落去，似曾相识燕归来。小园香径独徘徊。","燕(勿写雁)、径、徘徊"],
["八上","黄鹤楼","崔颢 · 唐","诗",1,"昔人已乘黄鹤去，此地空余黄鹤楼。|黄鹤一去不复返，白云千载空悠悠。|晴川历历汉阳树，芳草萋萋鹦鹉洲。|日暮乡关何处是？烟波江上使人愁。","昔、萋(勿写凄)、鹦、鹉、洲(勿写州)"],
["八上","记承天寺夜游","苏轼 · 宋","文言文",1,"元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。","遂、寝、藻、荇(xìng)、横"],
["八上","渡荆门送别","李白 · 唐","诗",1,"渡远荆门外，来从楚国游。|山随平野尽，江入大荒流。|月下飞天镜，云生结海楼。|仍怜故乡水，万里送行舟。","荆、镜、结、怜"],
["八上","生于忧患，死于安乐","《孟子》","文言文",1,"舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。|人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒亡。然后知生于忧患而死于安乐也。","畎(quǎn)、说(通悦，音yuè)、鬲(gé)、敖、奚、曾(通增)、衡(通横)、拂(bì)士"],
["八上","钱塘湖春行","白居易 · 唐","诗",1,"孤山寺北贾亭西，水面初平云脚低。|几处早莺争暖树，谁家新燕啄春泥。|乱花渐欲迷人眼，浅草才能没马蹄。|最爱湖东行不足，绿杨阴里白沙堤。","贾(jiǎ)、啄、渐、没(mò)、蹄、堤"],
["八上","愚公移山","《列子》","文言文",0,"太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。|北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：“吾与汝毕力平险，指通豫南，达于汉阴，可乎？”杂然相许。其妻献疑曰：“以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？”杂曰：“投诸渤海之尾，隐土之北。”遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。邻人京城氏之孀妻有遗男，始龀，跳往助之。寒暑易节，始一反焉。|河曲智叟笑而止之曰：“甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？”北山愚公长息曰：“汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉。子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？”河曲智叟亡以应。|操蛇之神闻之，惧其不已也，告之于帝。帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。自此，冀之南，汉之阴，无陇断焉。","仞(rèn)、惩、迂、箕畚(jī běn)、孀(shuāng)、龀(chèn)、叟、惠(通慧)、匮(kuì)、亡(通无)、厝(cuò)、雍、陇"],
["八上","饮酒（其五）","陶渊明 · 东晋","诗",1,"结庐在人境，而无车马喧。|问君何能尔？心远地自偏。|采菊东篱下，悠然见南山。|山气日夕佳，飞鸟相与还。|此中有真意，欲辨已忘言。","庐、喧、篱、悠、辨(勿写辩)"],
["八上","赤壁","杜牧 · 唐","诗",1,"折戟沉沙铁未销，自将磨洗认前朝。|东风不与周郎便，铜雀春深锁二乔。","戟(jǐ)、销、郎、乔"],
["八下","关雎","《诗经》","诗",1,"关关雎鸠，在河之洲。窈窕淑女，君子好逑。|参差荇菜，左右流之。窈窕淑女，寤寐求之。|求之不得，寤寐思服。悠哉悠哉，辗转反侧。|参差荇菜，左右采之。窈窕淑女，琴瑟友之。|参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。","雎(jū)、鸠、洲(勿写州)、窈窕(yǎo tiǎo)、逑(qiú)、荇(xìng)、寤寐(wù mèi)、辗、芼(mào)"],
["八下","桃花源记","陶渊明 · 东晋","文言文",1,"晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。|林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。|见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：“不足为外人道也。”|既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。|南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。","缤、俨(yǎn)、阡陌(qiān mò)、髫(tiáo)、怡、要(通邀)、邑、诣(yì)、骥"],
["八下","题破山寺后禅院","常建 · 唐","诗",1,"清晨入古寺，初日照高林。|曲径通幽处，禅房花木深。|山光悦鸟性，潭影空人心。|万籁此都寂，但余钟磬音。","禅、潭(勿写谭)、籁(lài)、磬(qìng)"],
["八下","石壕吏","杜甫 · 唐","诗",1,"暮投石壕村，有吏夜捉人。老翁逾墙走，老妇出门看。|吏呼一何怒！妇啼一何苦！|听妇前致词：三男邺城戍。一男附书至，二男新战死。存者且偷生，死者长已矣！室中更无人，惟有乳下孙。有孙母未去，出入无完裙。老妪力虽衰，请从吏夜归。急应河阳役，犹得备晨炊。|夜久语声绝，如闻泣幽咽。天明登前途，独与老翁别。","壕、逾、邺(yè)、戍(shù)、妪(yù)、炊、咽(yè)"],
["八下","小石潭记","柳宗元 · 唐","文言文",1,"从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。伐竹取道，下见小潭，水尤清冽。全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂。|潭中鱼可百许头，皆若空游无所依，日光下澈，影布石上。佁然不动，俶尔远逝，往来翕忽，似与游者相乐。|潭西南而望，斗折蛇行，明灭可见。其岸势犬牙差互，不可知其源。|坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。|同游者：吴武陵，龚古，余弟宗玄。隶而从者，崔氏二小生，曰恕己，曰奉壹。","篁(huáng)、冽(liè)、坻(chí)、屿、嵁(kān)、蔓、佁(yǐ)、俶(chù)、翕(xī)、邃(suì)、怆、龚"],
["八下","送友人","李白 · 唐","诗",1,"青山横北郭，白水绕东城。|此地一为别，孤蓬万里征。|浮云游子意，落日故人情。|挥手自兹去，萧萧班马鸣。","郭、蓬、兹、萧萧、班马"],
["八下","卖炭翁","白居易 · 唐","诗",1,"卖炭翁，伐薪烧炭南山中。满面尘灰烟火色，两鬓苍苍十指黑。卖炭得钱何所营？身上衣裳口中食。可怜身上衣正单，心忧炭贱愿天寒。夜来城外一尺雪，晓驾炭车辗冰辙。牛困人饥日已高，市南门外泥中歇。|翩翩两骑来是谁？黄衣使者白衫儿。手把文书口称敕，回车叱牛牵向北。一车炭，千余斤，宫使驱将惜不得。半匹红纱一丈绫，系向牛头充炭直。","薪、鬓、辗(niǎn)、辙(zhé)、骑(jì)、敕(chì)、叱(chì)、绫、直(通值)"],
["八下","北冥有鱼","《庄子》","文言文",0,"北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。《齐谐》者，志怪者也。《谐》之言曰：“鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。”野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。","冥(通溟)、鲲(kūn)、抟(tuán)、扶摇、邪(通耶)"],
["八下","卜算子·咏梅","陆游 · 宋","词",1,"驿外断桥边，寂寞开无主。已是黄昏独自愁，更着风和雨。|无意苦争春，一任群芳妒。零落成泥碾作尘，只有香如故。","驿(yì)、着(zhuó)、妒、碾(niǎn)"],
["八下","虽有嘉肴","《礼记》","文言文",1,"虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。是故学然后知不足，教然后知困。知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。《兑命》曰“学学半”，其此之谓乎！","嘉(勿写佳)、肴(yáo)、旨、自强(qiǎng)、兑(yuè)、学学(xiào xué)半"],
["九上","行路难（其一）","李白 · 唐","诗",1,"金樽清酒斗十千，玉盘珍羞直万钱。|停杯投箸不能食，拔剑四顾心茫然。|欲渡黄河冰塞川，将登太行雪满山。|闲来垂钓碧溪上，忽复乘舟梦日边。|行路难，行路难，多歧路，今安在？|长风破浪会有时，直挂云帆济沧海。","樽(zūn)、羞(通馐)、直(通值)、箸(zhù)、歧、济"],
["九上","无题（相见时难别亦难）","李商隐 · 唐","诗",1,"相见时难别亦难，东风无力百花残。|春蚕到死丝方尽，蜡炬成灰泪始干。|晓镜但愁云鬓改，夜吟应觉月光寒。|蓬山此去无多路，青鸟殷勤为探看。","炬(勿写烛)、鬓、蓬、殷勤、看(kān)"],
["九上","酬乐天扬州初逢席上见赠","刘禹锡 · 唐","诗",1,"巴山楚水凄凉地，二十三年弃置身。|怀旧空吟闻笛赋，到乡翻似烂柯人。|沉舟侧畔千帆过，病树前头万木春。|今日听君歌一曲，暂凭杯酒长精神。","凄、畔(勿写伴)、柯、暂、长(zhǎng)"],
["九上","岳阳楼记","范仲淹 · 宋","文言文",1,"庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴，乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，属予作文以记之。|予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯，朝晖夕阴，气象万千，此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？|若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空，日星隐曜，山岳潜形，商旅不行，樯倾楫摧，薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。|至若春和景明，波澜不惊，上下天光，一碧万顷，沙鸥翔集，锦鳞游泳，岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。|嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰“先天下之忧而忧，后天下之乐而乐”乎！噫！微斯人，吾谁与归？时六年九月十五日。","滕、谪(zhé)、属(通嘱)、汤汤(shāng)、晖、淫、霏、曜(yào)、樯(qiáng)、楫(jí)、冥、谗、芷(zhǐ)、汀(tīng)、璧、偕(xié)、嗟、噫"],
["九上","醉翁亭记","欧阳修 · 宋","文言文",1,"环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺，而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。|若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。朝而往，暮而归，四时之景不同，而乐亦无穷也。|至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。临溪而渔，溪深而鱼肥，酿泉为酒，泉香而酒洌，山肴野蔌，杂然而前陈者，太守宴也。宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。苍颜白发，颓然乎其间者，太守醉也。|已而夕阳在山，人影散乱，太守归而宾客从也。树林阴翳，鸣声上下，游人去而禽鸟乐也。然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。","滁(chú)、壑(hè)、蔚、琅琊(láng yá)、潺(chán)、辄(zhé)、霏、暝(míng)、晦、伛偻(yǔ lǚ)、洌(liè)、蔌(sù)、酣、弈(yì)、觥(gōng)、翳(yì)"],
["九上","丑奴儿·书博山道中壁","辛弃疾 · 宋","词",1,"少年不识愁滋味，爱上层楼。爱上层楼，为赋新词强说愁。|而今识尽愁滋味，欲说还休。欲说还休，却道“天凉好个秋”！","层楼、强(qiǎng)、休"],
["九上","水调歌头（明月几时有）","苏轼 · 宋","词",1,"丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。|明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。|转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。","阙(què)、琼(qióng)、绮(qǐ)、婵娟(勿写蝉)"],
["九下","江城子·密州出猎","苏轼 · 宋","词",1,"老夫聊发少年狂，左牵黄，右擎苍，锦帽貂裘，千骑卷平冈。为报倾城随太守，亲射虎，看孙郎。|酒酣胸胆尚开张。鬓微霜，又何妨！持节云中，何日遣冯唐？会挽雕弓如满月，西北望，射天狼。","擎(qíng)、貂裘(diāo qiú)、骑(jì)、冈、酣、鬓、妨、雕"],
["九下","鱼我所欲也","《孟子》","文言文",1,"鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚于生者，所恶有甚于死者。非独贤者有是心也，人皆有之，贤者能勿丧耳。|一箪食，一豆羹，得之则生，弗得则死。呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。万钟则不辩礼义而受之，万钟于我何加焉！为宫室之美、妻妾之奉、所识穷乏者得我与？乡为身死而不受，今为宫室之美为之；乡为身死而不受，今为妻妾之奉为之；乡为身死而不受，今为所识穷乏者得我而为之：是亦不可以已乎？此之谓失其本心。","兼、苟、恶(wù)、辟(通避)、箪(dān)、羹(gēng)、蹴(cù)、屑、辩(通辨)、乡(通向)、得(通德)"],
["九下","临江仙·夜登小阁，忆洛中旧游","陈与义 · 宋","词",1,"忆昔午桥桥上饮，坐中多是豪英。长沟流月去无声。杏花疏影里，吹笛到天明。|二十余年如一梦，此身虽在堪惊。闲登小阁看新晴。古今多少事，渔唱起三更。","豪英、疏、堪、阁、渔唱"],
["九下","破阵子·为陈同甫赋壮词以寄之","辛弃疾 · 宋","词",1,"醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。|马作的卢飞快，弓如霹雳弦惊。了却君王天下事，赢得生前身后名。可怜白发生！","挑(tiǎo)、麾(huī)、炙(zhì)、的卢(dí lú)、霹雳、赢(勿写羸)"],
["九下","别云间","夏完淳 · 明","诗",1,"三年羁旅客，今日又南冠。|无限河山泪，谁言天地宽！|已知泉路近，欲别故乡难。|毅魄归来日，灵旗空际看。","羁(jī)、冠(guān)、泉路、毅魄"],
["九下","过零丁洋","文天祥 · 宋","诗",1,"辛苦遭逢起一经，干戈寥落四周星。|山河破碎风飘絮，身世浮沉雨打萍。|惶恐滩头说惶恐，零丁洋里叹零丁。|人生自古谁无死？留取丹心照汗青。","遭逢、寥(liáo)、絮、萍、惶恐、零丁、汗青(勿写汉青)"],
["九下","送东阳马生序","宋濂 · 明","文言文",0,"余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。既加冠，益慕圣贤之道。又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。先达德隆望尊，门人弟子填其室，未尝稍降辞色。余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。故余虽愚，卒获有所闻。|当余之从师也，负箧曳屣行深山巨谷中。穷冬烈风，大雪深数尺，足肤皲裂而不知。至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。寓逆旅，主人日再食，无鲜肥滋味之享。同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；余则缊袍敝衣处其间，略无慕艳意，以中有足乐者，不知口体之奉不若人也。盖余之勤且艰若此。今虽耄老，未有所成，犹幸预君子之列，而承天子之宠光，缀公卿之后，日侍坐备顾问，四海亦谬称其氏名，况才之过于余者乎？|【教材节选多止于此，以下为原文后续，供拓展】今诸生学于太学，县官日有廪稍之供，父母岁有裘葛之遗，无冻馁之患矣；坐大厦之下而诵诗书，无奔走之劳矣；有司业、博士为之师，未有问而不告、求而不得者也；凡所宜有之书，皆集于此，不必若余之手录，假诸人而后见也。其业有不精、德有不成者，非天质之卑，则心不若余之专耳，岂他人之过哉！|东阳马生君则，在太学已二年，流辈甚称其贤。余朝京师，生以乡人子谒余，撰长书以为贽，辞甚畅达。与之论辨，言和而色夷。自谓少时用心于学甚劳，是可谓善学者矣。其将归见其亲也，余故道为学之难以告之。谓余勉乡人以学者，余之志也；诋我夸际遇之盛而骄乡人者，岂知予者哉！","嗜(shì)、砚、怠、逾、硕、叩、叱咄(chì duō)、俟(sì)、卒、箧(qiè)、曳屣(yè xǐ)、皲(jūn)、支(通肢)、媵(yìng)、衾(qīn)、被(通披)、绮(qǐ)、缨、臭(xiù)、烨(yè)、缊(yùn)、耄(mào)、廪(lǐn)、馁(něi)、谒(yè)、贽(zhì)、诋(dǐ)"],
["九下","曹刿论战","《左传》","文言文",0,"十年春，齐师伐我。公将战，曹刿请见。其乡人曰：“肉食者谋之，又何间焉？”刿曰：“肉食者鄙，未能远谋。”乃入见。问：“何以战？”公曰：“衣食所安，弗敢专也，必以分人。”对曰：“小惠未遍，民弗从也。”公曰：“牺牲玉帛，弗敢加也，必以信。”对曰：“小信未孚，神弗福也。”公曰：“小大之狱，虽不能察，必以情。”对曰：“忠之属也。可以一战。战则请从。”|公与之乘，战于长勺。公将鼓之。刿曰：“未可。”齐人三鼓。刿曰：“可矣。”齐师败绩。公将驰之。刿曰：“未可。”下视其辙，登轼而望之，曰：“可矣。”遂逐齐师。|既克，公问其故。对曰：“夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。”","刿(guì)、间(jiàn)、鄙、遍、帛、孚(fú)、福、狱、察、属、鼓、驰、辙(zhé)、轼(shì)、遂、竭、盈、靡(mǐ)"],
["九下","出师表","诸葛亮 · 三国","文言文",0,"先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。|宫中府中，俱为一体，陟罚臧否，不宜异同。若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理，不宜偏私，使内外异法也。|侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。|将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。|亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。|臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。|先帝知臣谨慎，故临崩寄臣以大事也。受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，故五月渡泸，深入不毛。今南方已定，兵甲已足，当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。此臣所以报先帝而忠陛下之职分也。至于斟酌损益，进尽忠言，则攸之、祎、允之任也。|愿陛下托臣以讨贼兴复之效；不效，则治臣之罪，以告先帝之灵。若无兴德之言，则责攸之、祎、允等之慢，以彰其咎。陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏。臣不胜受恩感激。今当远离，临表涕零，不知所言。","崩殂(cú)、弊、陛、菲薄、陟(zhì)、臧否(zāng pǐ)、攸(yōu)、祎(yī)、裨(bì)、阙(通缺)、淑、桓、猥(wěi)、驱驰、夙(sù)、泸(lú)、驽钝(nú dùn)、攘(rǎng)、斟酌(zhēn zhuó)、诹(zōu)、涕零"]
];

const box = document.getElementById("list");
const GN = ["六上","六下","七上","七下","八上","八下","九上","九下"];
let filter = "all", key = "", allOpen = false;

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}

function render(){
  const f = D.filter(r=>{
    if(filter==="star" && !r[4]) return false;
    if(filter==="wen" && r[3]!=="文言文") return false;
    if(filter==="shi" && r[3]==="文言文") return false;
    if(key && !(r[1]+r[2]+r[5]+r[6]).includes(key)) return false;
    return true;
  });
  if(!f.length){box.innerHTML='<p style="color:#5b6470;padding:16px">没有匹配的篇目</p>';return;}
  let h = "";
  GN.forEach(g=>{
    const arr = f.filter(r=>r[0]===g);
    if(!arr.length) return;
    const n = arr.filter(r=>r[4]).length;
    h += `<div class="grade">${g}　<span style="font-weight:400;font-size:13px;color:#5b6470">${arr.length} 篇，其中 ${n} 篇需默写</span></div>`;
    arr.forEach(r=>{
      const lines = r[5].split("|").map(t=>
        `<div class="ln${r[3]==="文言文"||r[3]==="词"?" i":""}">${esc(t)}</div>`).join("");
      h += `<div class="po${r[4]?" star":""}${allOpen?" open":""}">
        <div class="hd">
          ${r[4]?'<span class="tag m">★默写</span>':''}
          <span class="nm">${esc(r[1])}</span>
          <span class="au">${esc(r[2])}</span>
          <span class="tag">${r[3]}</span>
          <span class="ar">${allOpen?"收起":"展开"}</span>
        </div>
        <div class="body">${lines}<div class="err"><b>易错 / 注音：</b>${esc(r[6])}</div></div>
      </div>`;
    });
  });
  box.innerHTML = h;
  box.querySelectorAll(".hd").forEach(hd=>{
    hd.onclick = ()=>{
      const p = hd.parentElement;
      p.classList.toggle("open");
      hd.querySelector(".ar").textContent = p.classList.contains("open") ? "收起" : "展开";
    };
  });
}

document.querySelectorAll(".chip[data-f]").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".chip[data-f]").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); filter = b.dataset.f; render();
  };
});
document.getElementById("tog").onclick = e=>{
  allOpen = !allOpen;
  e.target.textContent = allOpen ? "收起全部" : "展开全部";
  render();
};
document.getElementById("q").addEventListener("input",e=>{key=e.target.value.trim();render();});
render();
</script>
</body>
</html>
