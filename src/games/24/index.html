<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>24 点</title>
<link rel="stylesheet" href="../../../vendor/katex/katex.min.css">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #f4f1ea;
    color: #2b2b2b;
    -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 560px; margin: 0 auto; padding: 12px 16px 32px; }
  .back { display: inline-block; color: #2f6fd6; text-decoration: none; font-size: 14px; padding: 4px 0 8px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  button { font: inherit; color: #2b2b2b; cursor: pointer; }
  #chapters, #levels { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #chapters button {
    min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #cfc8b8;
    background: #fff; font-size: 14px;
  }
  #chapters button.current { background: #2b2b2b; border-color: #2b2b2b; color: #fff; }
  #levels button {
    min-height: 36px; min-width: 44px; padding: 0 10px; border-radius: 8px; border: none;
    background: #e9e3d6; font-size: 13px; color: #5b5346;
  }
  #levels button.done { background: #d9eedd; color: #256b34; }
  #levels button.current { outline: 2px solid #2b2b2b; outline-offset: 1px; }
  #hint { font-size: 14px; line-height: 1.6; color: #555; margin: 4px 0 10px; }
  details.rules { font-size: 14px; line-height: 1.7; color: #555; margin: 0 0 10px; }
  details.rules summary { cursor: pointer; color: #2f6fd6; min-height: 32px; line-height: 32px; }
  details.rules ul { margin: 0; padding-left: 20px; }

  .choices { display: flex; gap: 8px; margin: 8px 0; }
  .choices button {
    flex: 1; min-height: 44px; border-radius: 10px; border: 2px solid #cfc8b8;
    background: #fff; font-size: 15px; font-weight: 600; line-height: 1.2;
  }
  .choices button small { display: block; font-size: 11px; font-weight: 400; color: #7a7366; }
  .choices button.on { border-color: #2b2b2b; background: #fff4e0; }
  .toggles { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; cursor: pointer; }
  .toggles input { width: 18px; height: 18px; accent-color: #2f6fd6; }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  .row > button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid #cfc8b8; background: #fff; font-size: 16px; }
  .row > button.primary { background: #2f6fd6; border-color: #2f6fd6; color: #fff; }

  .table { background: #2f7a55; border-radius: 14px; padding: 14px 10px; margin: 8px 0; }
  #cards { display: flex; justify-content: center; gap: 8px; }
  /* 扑克牌 63 × 88 mm，宽高约 5 : 7 */
  #cards .card { flex: 0 1 calc(25% - 6px); max-width: 100px; min-width: 0; aspect-ratio: 5 / 7; }
  .card {
    position: relative; border-radius: 8px; border: 2px solid transparent; overflow: hidden;
    background: #fffdf8; box-shadow: 0 2px 4px rgba(0,0,0,.2); padding: 16px 2px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    transition: transform .1s;
  }
  .card .corner { position: absolute; left: 5px; top: 3px; font-size: 13px; font-weight: 600; line-height: 1.1; }
  .card .corner.bottom { left: auto; top: auto; right: 5px; bottom: 3px; transform: rotate(180deg); }
  .card .val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; }
  .card.red { color: #c9302c; }
  .card.used { opacity: .35; }
  .card.made { background: #fff4d6; padding: 4px 3px; }
  .card .expr {
    font-size: 11px; color: #7a7366; line-height: 1.3; word-break: break-all; max-width: 100%;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .card.sel { border-color: #2f6fd6; transform: translateY(-6px); }
  .card.hint { border-color: #f0a830; }
  .card.win { border-color: #3aa35a; }
  .fr { display: inline-flex; flex-direction: column; align-items: center; font-size: 18px; line-height: 1.1; margin-left: 1px; }
  .fr span:first-child { border-bottom: 2px solid currentColor; padding: 0 2px; }

  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; }
  .head h1 { margin: 0; }
  #mode { display: flex; flex: none; padding: 2px; border-radius: 18px; background: #e9e3d6; }
  #mode button { min-height: 36px; padding: 0 12px; border: none; border-radius: 16px; background: none; font-size: 13px; color: #5b5346; }
  #mode button.on { background: #fff; color: #2b2b2b; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  #bar {
    min-height: 44px; margin-bottom: 12px; padding: 8px 12px; border-radius: 8px; background: #fffdf8;
    font-size: 20px; line-height: 28px; font-variant-numeric: tabular-nums; word-break: break-all;
  }
  #bar.guide { font-size: 14px; line-height: 20px; color: #7a7366; }
  #bar.step { font-size: 16px; }
  #bar.win { box-shadow: inset 0 0 0 2px #3aa35a; }
  #ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
  #ops.compact { grid-template-columns: repeat(7, 1fr); gap: 6px; }
  #ops.compact .op { min-height: 40px; min-width: 0; padding: 0; font-size: 20px; }
  .op {
    min-height: 48px; border-radius: 10px; border: 2px solid #cfc8b8; background: #fff;
    font-size: 24px; font-weight: 700;
  }
  .op.on { background: #2f6fd6; border-color: #2f6fd6; color: #fff; }
  .op.hint { border-color: #f0a830; }
  #actions { display: flex; flex-wrap: wrap; gap: 8px; }
  #actions button {
    flex: 1 1 60px; min-height: 44px; border-radius: 10px; border: 1px solid #cfc8b8; background: #fff; font-size: 15px;
  }
  #actions button.none { background: #fbe7e4; border-color: #e2b3ab; color: #9a3326; font-weight: 600; }

  #message { font-size: 15px; line-height: 1.6; margin: 10px 0; padding: 8px 10px; border-radius: 8px; background: #f0ece2; }
  #message:empty { display: none; }
  #message.ok { background: #e3f3e6; color: #256b34; }
  #message.fail { background: #fbe7e4; color: #9a3326; }
  #info:empty { display: none; }
  .formula {
    font-size: 20px; text-align: center; background: #fffdf8; border-radius: 10px; padding: 12px 8px;
    margin: 0; overflow-x: auto;
  }
</style>
</head>
<body>
<main id="app">
  <a class="back" href="../../../index.html">‹ 返回首页</a>
  <div class="head">
    <h1>24 点</h1>
    <nav id="mode"></nav>
  </div>
  <nav id="chapters"></nav>
  <nav id="levels"></nav>
  <p id="hint"></p>
  <details class="rules">
    <summary>玩法说明</summary>
    <ul>
      <li>4 张牌用 + − × ÷ 算出 24，每张牌都要用，而且只用一次；可以加括号，中间可以出现分数</li>
      <li>A 算 1，J、Q、K 算 11、12、13</li>
      <li>写算式：点牌、运算符和括号，像按计算器一样写出算式，4 张牌都用上后自动算结果；按 ⌫ 删掉最后一个</li>
      <li>一步一步算：点一张牌 → 点运算符 → 点另一张牌，两张牌就合成一张，相当于给这一步加了括号；合到只剩一张时看是不是 24</li>
      <li>有理数版：红色牌（♥ ♦）算负数，红 5 就是 −5</li>
    </ul>
  </details>
  <section id="setup"></section>
  <div class="table">
    <div id="bar"></div>
    <div id="cards"></div>
  </div>
  <div id="ops"></div>
  <div id="actions"></div>
  <p id="message"></p>
  <section id="info"></section>
</main>
<script src="../../../vendor/katex/katex.min.js"></script>
<script src="../../answer.js"></script>
<script src="solver.js"></script>
<script src="game.js"></script>
</body>
</html>
